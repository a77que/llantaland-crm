server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=30s ipv6=off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Backend. OJO: usar el alias ÚNICO del proyecto (no "api", que colisiona
    # con el alias "api" de otros proyectos en la red compartida de Easypanel).
    # Proxy API → backend (sin path en proxy_pass para preservar la URI completa)
    location /api/ {
        set $api http://llantaland-crm-api:3001;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 25m;
    }

    # Proxy WebSocket (Socket.IO del chat interno) → backend
    location /socket.io/ {
        set $api http://llantaland-crm-api:3001;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Proxy uploads → backend
    location /uploads/ {
        set $api http://llantaland-crm-api:3001;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Proxy media (audios del bot, etc.) → backend
    location /media/ {
        set $api http://llantaland-crm-api:3001;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # index.html sin caché
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Service worker y manifest de la PWA: NUNCA cachear (si no, no se actualizan
    # tras un deploy y el push/instalación quedan con una versión vieja). El
    # match exacto "=" tiene prioridad sobre la regla de caché de .js de abajo.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash — caché larga
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
